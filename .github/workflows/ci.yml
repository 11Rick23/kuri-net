name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kuri_net
      NEXT_PUBLIC_ASSET_BASE_URL: https://example.com
      BETTER_AUTH_SECRET: ci-only-7qfY1mP9vL3xN8kR2sW6cA4dH0jT5uB
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Build
        run: bun run build
