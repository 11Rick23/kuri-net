name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format・Lint・型・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kuri_net
      NEXT_PUBLIC_ASSET_BASE_URL: https://example.com
      BETTER_AUTH_SECRET: ci-only-7qfY1mP9vL3xN8kR2sW6cA4dH0jT5uB
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bun をセットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: フォーマットを検証
        run: bun run format:check

      - name: Lint を実行
        run: bun run lint

      - name: 型チェックを実行
        run: bun run typecheck

      - name: テストを実行
        run: bun run test

      - name: 本番用ビルドを検証
        run: bun run build
