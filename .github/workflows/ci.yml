name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format・Lint・型・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kuri_net
      NEXT_PUBLIC_ASSET_BASE_URL: https://example.com
      BETTER_AUTH_SECRET: ci-only-7qfY1mP9vL3xN8kR2sW6cA4dH0jT5uB
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bun をセットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: フォーマットを検証
        run: bun run format:check

      - name: Lint を実行
        run: bun run lint

      - name: 型チェックを実行
        run: bun run typecheck

      - name: テストを実行
        run: bun run test

      - name: 本番用ビルドを検証
        run: bun run build

  image:
    name: Dockerイメージの検証・公開
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kuri_net
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kuri_net"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: イメージ名とアセットURLを設定
        id: config
        env:
          ASSET_BASE_URL: ${{ vars.NEXT_PUBLIC_ASSET_BASE_URL }}
        run: |
          if [ "$PUBLISH_IMAGE" = true ] && [ -z "$ASSET_BASE_URL" ]; then
            echo '::error::Repository variables に NEXT_PUBLIC_ASSET_BASE_URL を設定してください。'
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "asset_base_url=${ASSET_BASE_URL:-https://example.com}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx をセットアップ
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Dockerイメージをビルド
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kuri-net:ci
          build-args: |
            NEXT_PUBLIC_ASSET_BASE_URL=${{ steps.config.outputs.asset_base_url }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=kuri-net
          cache-to: type=gha,mode=max,scope=kuri-net

      - name: 起動とDBマイグレーションを検証
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kuri_net
          BETTER_AUTH_SECRET: ci-only-7qfY1mP9vL3xN8kR2sW6cA4dH0jT5uB
          BETTER_AUTH_URL: http://localhost:3100
        run: |
          docker run -d --name kuri-net-smoke --network host \
            -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL \
            -e PORT=3100 kuri-net:ci
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            --max-time 5 http://localhost:3100/ --output /tmp/kuri-net-home.html
          grep -q 'お知らせ' /tmp/kuri-net-home.html
          for route_path in profile works apps apps/minesweeper api/auth/get-session logo.svg; do
            curl --fail --silent --show-error --max-time 15 \
              "http://localhost:3100/$route_path" --output /dev/null
          done
          css_path=$(grep -oE '/_next/static/[^" ]+\.css' /tmp/kuri-net-home.html | head -n 1)
          test -n "$css_path"
          curl --fail --silent --show-error --max-time 15 \
            "http://localhost:3100$css_path" --output /dev/null
          docker exec kuri-net-smoke bun ./migrate.js

      - name: 検証コンテナのログを確認・削除
        if: always()
        run: |
          if docker container inspect kuri-net-smoke > /dev/null 2>&1; then
            docker logs kuri-net-smoke
            docker rm -f kuri-net-smoke
          fi

      - name: GHCR にログイン
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 検証済みイメージを公開
        if: env.PUBLISH_IMAGE == 'true'
        env:
          IMAGE: ${{ steps.config.outputs.image }}
        run: |
          docker tag kuri-net:ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag kuri-net:ci "$IMAGE:main"
          docker push "$IMAGE:main"
          echo "公開イメージ: \`$IMAGE:sha-$GITHUB_SHA\` / \`$IMAGE:main\`" >> "$GITHUB_STEP_SUMMARY"
